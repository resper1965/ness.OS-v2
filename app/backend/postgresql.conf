# -------------------------------------------------------
# NessOps — PostgreSQL 16 + TimescaleDB + pgvector
# Otimizado para Storage VPS 20 (3 vCPU, 8 GB RAM, 400 GB SSD)
# -------------------------------------------------------
#
# Filosofia: forçar cache em memória, minimizar escrita síncrona.
# Contabo Storage VPS tem IOPS flutuantes — compensar com RAM.
#

# === MEMÓRIA ===

# 25% da RAM para buffers compartilhados (2 GB de 8 GB)
shared_buffers = 2GB

# 75% da RAM — informa o planner quanto de OS cache esperar
effective_cache_size = 6GB

# Memória por operação de sort/hash (cuidado: multiplica por conexão)
work_mem = 32MB

# Manutenção: VACUUM, CREATE INDEX, ALTER TABLE
maintenance_work_mem = 512MB

# === WAL & ESCRITA EM DISCO ===

# CRÍTICO: desliga fsync por transação — aceita perder até 
# 3x wal_writer_delay de dados em crash. Em IOPS flutuantes,
# isso reduz latência de escrita em 5-10x.
synchronous_commit = off

# WAL writer flush a cada 200ms (padrão)
wal_writer_delay = 200ms

# Buffers de WAL — 64 MB (reduz flushes frequentes)
wal_buffers = 64MB

# Checkpoint: espalha I/O ao longo de 90% do intervalo
checkpoint_completion_target = 0.9

# Checkpoints a cada 15 min (reduz escritas de checkpoint)
checkpoint_timeout = 15min

# WAL máximo entre checkpoints (1 GB)
max_wal_size = 1GB
min_wal_size = 256MB

# === SSD TUNING ===

# SSD: custo de acesso aleatório ≈ sequencial
random_page_cost = 1.1
seq_page_cost = 1.0

# SSD: I/O concorrente alto
effective_io_concurrency = 200

# === CONEXÕES ===

# Contabo VPS com 3 vCPU: max_connections conservador
# FastAPI + Celery workers não precisam de mais
max_connections = 100

# === LOGGING (performance debug) ===

# Queries lentas (> 1 segundo)
log_min_duration_statement = 1000

# Estatísticas de I/O para diagnóstico
track_io_timing = on

# === AUTOVACUUM (agressivo para hypertables do TimescaleDB) ===

autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05

# === TimescaleDB ===

# Habilitar TimescaleDB
shared_preload_libraries = 'timescaledb'

# Workers para jobs em background do TimescaleDB
timescaledb.max_background_workers = 4

# Telemetria desligada (privacidade)
timescaledb.telemetry_level = off

# === pgvector (HNSW index) ===

# Memória para construção de índice HNSW
# maintenance_work_mem = 512MB já cobre isso

# Paralelismo na construção de índice
max_parallel_maintenance_workers = 2
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# Para buscas HNSW: aumentar probes melhora recall às custas de latência
# SET LOCAL ivfflat.probes = 10;  -- por query (não global)
# SET LOCAL hnsw.ef_search = 100; -- por query para HNSW

# === TUNING GERAL ===

# Huge pages: melhor TLB hit rate com shared_buffers grandes
huge_pages = try

# JIT: desligado (overhead > ganho para queries simples do NessOps)
jit = off

# Planner: favorece index scans em SSD
enable_seqscan = on
enable_indexscan = on
enable_bitmapscan = on

services:
  glpi-db:
    image: mariadb:10.11@sha256:be981e4113326ada8d6004174dd09eeaefc03094037f811182a52d4f2e737350
    container_name: ninf-glpi-db
    restart: unless-stopped
    # Senhas do banco ficam fora do app/.env: o Hub recebe o .env inteiro e não deve vê-las.
    # glpi-db.env: MYSQL_ROOT_PASSWORD e MYSQL_PASSWORD (só o banco). glpi-app.env: DB_PASSWORD
    # (só o GLPI). A senha root não chega ao app. O preflight confere os dois arquivos.
    env_file:
      - /etc/ness-os/glpi-db.env
    environment:
      - MYSQL_DATABASE=glpi
      - MYSQL_USER=glpi
    volumes:
      - glpi-db-data:/var/lib/mysql
    networks:
      - glpi-db-net
    deploy:
      resources:
        limits:
          memory: 512M

  glpi:
    image: elestio/glpi:latest@sha256:48ec3ce559fda9eaf73c6fe2f0fc2dd382ef013f2dda14004f34ee88ec17c8b8
    container_name: ninf-glpi
    restart: unless-stopped
    depends_on:
      - glpi-db
    env_file:
      - /etc/ness-os/glpi-app.env
    environment:
      - GLPI_LANG=pt_BR
      - DB_HOST=glpi-db
      - DB_USER=glpi
      - DB_DATABASE=glpi
    volumes:
      - glpi-data:/var/www/html/glpi
      - glpi-state:/var/glpi
    networks:
      - ninf-net
      - glpi-db-net
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  glpi-db-data:
  glpi-data:
  glpi-state:
    name: app_glpi-state

networks:
  ninf-net:
    name: app_ninf-net
    external: true
  # Só o banco e o GLPI; sem rota externa. O Hub (ninf-net) não resolve glpi-db.
  glpi-db-net:
    internal: true

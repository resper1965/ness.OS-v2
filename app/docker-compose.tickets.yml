services:
  glpi-db:
    image: mariadb:10.11
    container_name: ninf-glpi-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${NINF_GLPI_DB_ROOT_PASSWORD:-root_pass_nessops_2026}
      - MYSQL_DATABASE=glpi
      - MYSQL_USER=glpi
      - MYSQL_PASSWORD=${NINF_GLPI_DB_PASSWORD:-glpi_pass_nessops_2026}
    volumes:
      - glpi-db-data:/var/lib/mysql
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 512M

  glpi:
    image: elestio/glpi:latest
    container_name: ninf-glpi
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - glpi-db
    environment:
      - GLPI_LANG=pt_BR
      - DB_HOST=glpi-db
      - DB_USER=glpi
      - DB_PASSWORD=${NINF_GLPI_DB_PASSWORD:-glpi_pass_nessops_2026}
      - DB_DATABASE=glpi
    volumes:
      - glpi-data:/var/www/html/glpi
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  glpi-db-data:
  glpi-data:

networks:
  ninf-net:
    name: app_ninf-net
    external: true

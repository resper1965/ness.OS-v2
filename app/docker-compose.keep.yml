# ================================================
# n.infraops — Keep (AIOps Hub)
# ================================================
# Para rodar junto com o app principal:
# docker compose -f docker-compose.yml -f docker-compose.keep.yml up -d

services:
  keep-backend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-api:latest
    container_name: ninf-keep-backend
    restart: unless-stopped
    environment:
      # Keep usa o banco de dados PostgreSQL existente
      - DATABASE_CONNECTION_STRING=postgresql://nessops:${NINF_DB_PASSWORD:-changeme}@postgres:5432/nessops
      # Autenticação
      - KEEP_JWT_SECRET=${NINF_JWT_SECRET:-please-set-a-strong-secret-in-dot-env}
      - KEEP_UI_URL=https://keep.ness.com.br
      # Integrações de Workflow
      - NINF_N8N_BASE_URL=${NINF_N8N_BASE_URL}
      - NINF_N8N_PASSWORD=${NINF_N8N_PASSWORD}
      - NINF_N8N_WEBHOOK_INCIDENT=${NINF_N8N_WEBHOOK_INCIDENT}
      - NINF_N8N_WEBHOOK_POSTMORTEM=${NINF_N8N_WEBHOOK_POSTMORTEM}
      - KEEP_WORKFLOWS_DIRECTORY=/keep/workflows
      - AUTH_TYPE=NOAUTH
    volumes:
      - ./keep/workflows:/keep/workflows:ro
    depends_on:
      - postgres
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 1G

  keep-frontend:
    image: us-central1-docker.pkg.dev/keephq/keep/keep-ui:latest
    container_name: ninf-keep-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - API_URL=http://keep-backend:8080
      - AUTH_TYPE=NOAUTH
    depends_on:
      - keep-backend
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 512M

# Usa a rede definida no docker-compose.yml principal
networks:
  ninf-net:
    driver: bridge

# ================================================
# n.infraops — Docker Compose (Stack Completa)
# ================================================
# Uso: docker compose up -d
# Requer: .env (copiar de .env.example)

services:

  # --- API Backend (FastAPI) ---
  api:
    image: ${NINF_API_IMAGE:?NINF_API_IMAGE is required}
    container_name: ninf-api
    restart: unless-stopped
    env_file:
      - .env
      - /etc/ness-os/glpi-integration.env
      - /etc/ness-os/zabbix-integration.env
    environment:
      # JWT secret fixo — tokens sobrevivem restarts do container
      NINF_JWT_SECRET: ${NINF_JWT_SECRET:?NINF_JWT_SECRET is required}
      NINF_DASHBOARD_BASE_URL: ${NINF_DASHBOARD_BASE_URL:-https://hub.ness.com.br}
      NINF_SESSION_COOKIE_SECURE: ${NINF_SESSION_COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Celery Worker (Alertas) ---
  worker-alerts:
    image: ${NINF_API_IMAGE:?NINF_API_IMAGE is required}
    container_name: ninf-worker-alerts
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker
      --queues=alerts.primary,alerts.deferred
      --concurrency=4
      --beat
      --schedule=/tmp/celerybeat-schedule
      --loglevel=info
      --hostname=alerts@%h
    env_file:
      - .env
      - /etc/ness-os/glpi-integration.env
      - /etc/ness-os/zabbix-integration.env
    depends_on:
      - api
    networks:
      - ninf-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 15s celery -A app.workers.celery_app inspect ping -d alerts@$$(hostname) 2>&1 | grep -qc pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Celery Worker (ML + Post-mortem) ---
  worker-ml:
    image: ${NINF_API_IMAGE:?NINF_API_IMAGE is required}
    container_name: ninf-worker-ml
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker
      --queues=ml
      --concurrency=2
      --loglevel=info
      --hostname=ml@%h
    env_file: .env
    depends_on:
      - api
    networks:
      - ninf-net
    healthcheck:
      test: ["CMD-SHELL", "timeout 15s celery -A app.workers.celery_app inspect ping -d ml@$$(hostname) 2>&1 | grep -qc pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # --- PostgreSQL 16 (TimescaleDB + pgvector) ---
  postgres:
    image: timescale/timescaledb:latest-pg16@sha256:ba149561ad4ddff5940d6eb0a0df60aefd1355cee1a450928f271267038fc888
    container_name: ninf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nessops
      POSTGRES_USER: nessops
      POSTGRES_PASSWORD: ${NINF_DB_PASSWORD:?NINF_DB_PASSWORD is required}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backend/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 3G
    shm_size: 256m

  # --- Redis 7 (Cache + Celery Broker + Locks) ---
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: ninf-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 300M


  # --- Frontend (React/Vite, API same-origin via Caddy) ---
  frontend:
    image: ${NINF_FRONTEND_IMAGE:?NINF_FRONTEND_IMAGE is required}
    container_name: ninf-frontend
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Caddy (Reverse Proxy + HTTPS Automático) ---
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: ninf-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - ninf-net
    depends_on:
      - api
      - frontend

  # --- Authentik SSO Server ---
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
    container_name: ninf-authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: nessops
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${NINF_DB_PASSWORD:?NINF_DB_PASSWORD is required}
      AUTHENTIK_SECRET_KEY: ${NINF_AUTHENTIK_SECRET_KEY:?NINF_AUTHENTIK_SECRET_KEY is required}
      AUTHENTIK_EMAIL__HOST: ${NINF_SMTP_HOST:-smtp.resend.com}
      AUTHENTIK_EMAIL__PORT: ${NINF_SMTP_PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${NINF_SMTP_USERNAME:-resend}
      AUTHENTIK_EMAIL__PASSWORD: ${NINF_RESEND_API_KEY:?NINF_RESEND_API_KEY is required}
      AUTHENTIK_EMAIL__USE_TLS: ${NINF_SMTP_USE_TLS:-true}
      AUTHENTIK_EMAIL__USE_SSL: ${NINF_SMTP_USE_SSL:-false}
      AUTHENTIK_EMAIL__TIMEOUT: 10
      AUTHENTIK_EMAIL__FROM: "${NINF_AUTHENTIK_EMAIL_FROM:-ness. identidade <identidade@ness.com.br>}"
    volumes:
      - authentik-media:/media
      - authentik-certs:/certs
      - authentik-templates:/templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 1G

  # --- Authentik SSO Worker ---
  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
    container_name: ninf-authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: nessops
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${NINF_DB_PASSWORD:?NINF_DB_PASSWORD is required}
      AUTHENTIK_SECRET_KEY: ${NINF_AUTHENTIK_SECRET_KEY:?NINF_AUTHENTIK_SECRET_KEY is required}
      AUTHENTIK_EMAIL__HOST: ${NINF_SMTP_HOST:-smtp.resend.com}
      AUTHENTIK_EMAIL__PORT: ${NINF_SMTP_PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${NINF_SMTP_USERNAME:-resend}
      AUTHENTIK_EMAIL__PASSWORD: ${NINF_RESEND_API_KEY:?NINF_RESEND_API_KEY is required}
      AUTHENTIK_EMAIL__USE_TLS: ${NINF_SMTP_USE_TLS:-true}
      AUTHENTIK_EMAIL__USE_SSL: ${NINF_SMTP_USE_SSL:-false}
      AUTHENTIK_EMAIL__TIMEOUT: 10
      AUTHENTIK_EMAIL__FROM: "${NINF_AUTHENTIK_EMAIL_FROM:-ness. identidade <identidade@ness.com.br>}"
    volumes:
      - authentik-media:/media
      - authentik-certs:/certs
      - authentik-templates:/templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:
  authentik-media:
  authentik-certs:
  authentik-templates:

networks:
  ninf-net:
    driver: bridge

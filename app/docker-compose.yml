# ================================================
# n.infraops — Docker Compose (Stack Completa)
# ================================================
# Uso: docker compose up -d
# Requer: .env (copiar de .env.example)

services:

  # --- API Backend (FastAPI) ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninf-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend/app:/app/app:ro   # bind-mount: código atualizado sem rebuild
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Celery Worker (Alertas) ---
  worker-alerts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninf-worker-alerts
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker
      --queues=alerts.primary,alerts.deferred
      --concurrency=4
      --loglevel=info
      --hostname=alerts@%h
    env_file: .env
    depends_on:
      - api
    networks:
      - ninf-net
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d alerts@* 2>&1 | grep -qc pong || exit 0"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Celery Worker (ML + Post-mortem) ---
  worker-ml:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ninf-worker-ml
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker
      --queues=ml
      --concurrency=2
      --loglevel=info
      --hostname=ml@%h
    env_file: .env
    depends_on:
      - api
    networks:
      - ninf-net
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d ml@* 2>&1 | grep -qc pong || exit 0"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # --- PostgreSQL 16 (TimescaleDB + pgvector) ---
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ninf-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nessops
      POSTGRES_USER: nessops
      POSTGRES_PASSWORD: ${NINF_DB_PASSWORD:-changeme}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backend/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nessops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 3G
    shm_size: 256m

  # --- Redis 7 (Cache + Celery Broker + Locks) ---
  redis:
    image: redis:7-alpine
    container_name: ninf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 300M

  # --- n8n (Orquestração de borda) ---
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: ninf-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ${NINF_N8N_PASSWORD:-changeme}
      WEBHOOK_URL: http://n8n:5678
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 1G

  # --- Evolution API (WhatsApp Gateway) ---
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: ninf-evolution
    restart: on-failure:5
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${NINF_EVOLUTION_API_KEY:-changeme}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://nessops:${NINF_DB_PASSWORD:-changeme}@postgres:5432/nessops
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DATABASE_ENABLED=true
      - SKIP_MIGRATE=${NINF_EVOLUTION_SKIP_MIGRATE:-false}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/5
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_REDIS_TTL=604800
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evolution-instances:/evolution/instances
      - evolution-store:/evolution/store
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 1.5G

  # --- Frontend (Next.js/React App) ---
  frontend:
    build:
      context: ./frontend
    container_name: ninf-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - ninf-net
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Caddy (Reverse Proxy + HTTPS Automático) ---
  caddy:
    image: caddy:2-alpine
    container_name: ninf-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - ninf-net
    depends_on:
      - api
      - n8n
      - evolution-api
      - frontend

volumes:
  pg-data:
  redis-data:
  n8n-data:
  evolution-instances:
  evolution-store:
  caddy-data:
  caddy-config:

networks:
  ninf-net:
    driver: bridge

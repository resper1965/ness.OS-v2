# ==========================================
# Keep Workflow: zabbix-correlation
# ==========================================
# Disparado quando alertas chegam do Provider do Zabbix no Keep.
# 1. Agrupa por hostname (5 minutos)
# 2. Higieniza dados
# 3. Dispara próximo passo

workflow:
  id: zabbix-correlation-and-cleaning
  description: "Deduplica alertas Zabbix por host e higieniza payload"

  # Gatilhos (Triggers)
  triggers:
    - type: alert
      # Filtra alertas vindos apenas do source zabbix
      filters:
        - key: source
          value: zabbix
        # Apenas eventos não resolvidos
        - key: status
          value: firing

  # Ações (Steps)
  actions:
    # 1. Agrupar alertas (Deduplicação Nativa do Keep)
    - id: group_by_host
      name: "Agrupar alertas por host em janela de 5 min"
      provider:
        type: keep
      with:
        groupBy: ["{{ alert.host.name }}", "{{ alert.cluster_id }}"]
        timeWindow: 300 # 5 minutos
        
    # 2. Higienização de Dados (Sanitização)
    # Roda um script Python simples ou função de mapping no Keep para ofuscar
    - id: sanitize_payload
      name: "Higienizar payload LGPD"
      provider:
        type: python
      with:
        code: |
          import re
          import json
          
          def sanitize(data):
              text = json.dumps(data)
              # Mascarar IPs privados (ex: 10.x.x.x, 192.168.x.x)
              text = re.sub(r'(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})', '[REDACTED_IP]', text)
              # Mascarar possíveis tokens/senhas
              text = re.sub(r'(?i)(password|token|secret)["\s:=]+[^\s",]+', r'\1: [REDACTED_SECRET]', text)
              return json.loads(text)
              
          alert_data = {{ alert }}
          return sanitize(alert_data)

    # 3. Encaminha para o workflow de escalonamento se validado
    - id: trigger_escalation
      name: "Chamar Workflow de Escalonamento (n8n + API)"
      provider:
        type: keep
      with:
        workflow_id: escalate-incident
        payload: "{{ steps.sanitize_payload.results }}"

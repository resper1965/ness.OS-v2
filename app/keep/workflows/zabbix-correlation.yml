# ==========================================
# Keep Workflow: zabbix-correlation
# ==========================================
# Disparado quando alertas chegam do Provider do Zabbix no Keep.
# 1. Agrupa por hostname (5 minutos)
# 2. Higieniza dados
# 3. Dispara próximo passo

workflow:
  id: zabbix-correlation-and-cleaning
  description: "Deduplica alertas Zabbix por host e higieniza payload"

  # Gatilhos (Triggers)
  triggers:
    - type: alert
      # Filtra alertas vindos apenas do source zabbix
      filters:
        - key: source
          value: zabbix
        # Apenas eventos não resolvidos
        - key: status
          value: firing

  steps:
    # 1. Higienização de Dados (Sanitização)
    - id: sanitize_payload
      name: sanitize_payload
      provider:
        type: python
        with:
          imports: "re,json"
          code: |
            (lambda null=None, true=True, false=False: json.loads(re.sub(r'(?i)(password|token|secret)["\s:=]+[^\s",]+', r'\1: [REDACTED_SECRET]', re.sub(r'(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})', '[REDACTED_IP]', json.dumps({{ alert }})))))()

    # 2. Encaminha para o workflow de escalonamento se validado
    - id: trigger_escalation
      name: "Chamar Workflow de Escalonamento (n8n + API)"
      provider:
        type: python
        with:
          code: |
            (lambda ld={}: (exec('''
            import urllib.request
            import json
            req_list = urllib.request.Request(
                "http://localhost:8080/workflows",
                headers={"Authorization": "Bearer no_auth"}
            )
            with urllib.request.urlopen(req_list) as response:
                workflows = json.loads(response.read().decode())
                escalate_wf = next(w for w in workflows if w["name"] == "escalate-incident")
                wf_id = escalate_wf["id"]

            payload = {{ steps.sanitize_payload.results }}
            req_run = urllib.request.Request(
                f"http://localhost:8080/workflows/{wf_id}/run",
                data=json.dumps(payload).encode("utf-8"),
                headers={
                    "Authorization": "Bearer no_auth",
                    "Content-Type": "application/json"
                }
            )
            with urllib.request.urlopen(req_run) as response:
                result = json.loads(response.read().decode())
            ''', globals(), ld), ld.get('result'))[1])()


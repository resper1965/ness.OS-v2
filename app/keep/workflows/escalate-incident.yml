# ==========================================
# Keep Workflow: escalate-incident
# ==========================================
# Invocado pelo zabbix-correlation após deduplicação e limpeza.
# Dispara as ações para n8n e FastAPI (Gemini).

workflow:
  id: escalate-incident
  description: "Escalona incidentes validados para n8n (ticket) e FastAPI (RCA)"

  # Este workflow é acionado via chamada manual (sub-workflow)
  triggers:
    - type: manual

  steps:
    - id: execute_escalation
      name: "Executar fluxo completo de escalonamento (n8n + FastAPI)"
      provider:
        type: python
        with:
          code: |
            (lambda ld={}: (exec('''
            import os
            import requests
            import json

            null = None
            true = True
            false = False
            alert_dict = {{ alert }}
            import json
            if isinstance(alert_dict, str):
                alert_dict = json.loads(alert_dict)

            # 1. Notify n8n
            n8n_url = os.environ.get('NINF_N8N_BASE_URL', '').rstrip('/') + os.environ.get('NINF_N8N_WEBHOOK_INCIDENT', '/webhook/eNLsgPPhK4ReW36t/webhook/incident-created')
            n8n_headers = {
                "Content-Type": "application/json",
                "Authorization": f"Bearer {os.environ.get('NINF_N8N_PASSWORD')}"
            }
            host_val = alert_dict.get("host") or {}
            if isinstance(host_val, dict):
                host_name = host_val.get("name") or alert_dict.get("host_name")
            else:
                host_name = str(host_val) or alert_dict.get("host_name")

            trigger_val = alert_dict.get("trigger") or {}
            if isinstance(trigger_val, dict):
                event_name = trigger_val.get("name") or alert_dict.get("trigger_name") or alert_dict.get("event_name")
            else:
                event_name = str(trigger_val) or alert_dict.get("trigger_name") or alert_dict.get("event_name")

            # Resolvendo o nome do cliente
            def resolve_customer_name(h_name, tags_dict):
                for k in ("cliente", "client", "customer", "tenant", "Cliente", "Client", "Customer", "Tenant"):
                    if tags_dict and k in tags_dict and tags_dict[k]:
                        return tags_dict[k]
                if "-" in h_name:
                    parts = h_name.split("-")
                    if len(parts) > 1:
                        first = parts[0]
                        if first.lower() not in ("wan", "lan", "srv", "web", "db", "app", "fw", "vpn", "core", "test"):
                            return first.upper()
                if "wan-core" in h_name.lower() or "web-server" in h_name.lower():
                    return "Ness"
                return "Outros"

            customer_name = resolve_customer_name(host_name, alert_dict.get("tags", {}))

            n8n_body = {
                "fingerprint": alert_dict.get("fingerprint") or alert_dict.get("id"),
                "host_name": host_name,
                "customer_name": customer_name,
                "severity": alert_dict.get("severity"),
                "event_name": event_name,
                "clean_payload": alert_dict
            }

            ticket_id = None
            try:
                resp_n8n = requests.post(n8n_url, json=n8n_body, headers=n8n_headers, timeout=10)
                resp_n8n.raise_for_status()
                ticket_id = resp_n8n.json().get("ticket_id")
            except Exception as e:
                print(f"n8n notification failed: {e}")

            # 2. Trigger RCA in FastAPI
            rca_url = "http://api:8000/api/incident/analyze"
            rca_headers = {
                "Content-Type": "application/json"
            }
            rca_body = {
                "incident_data": alert_dict,
                "ticket_id": ticket_id
            }

            try:
                resp_rca = requests.post(rca_url, json=rca_body, headers=rca_headers, timeout=10)
                resp_rca.raise_for_status()
                result = resp_rca.json()
            except Exception as e:
                raise Exception(f"FastAPI RCA trigger failed: {e}")
            ''', globals(), ld), ld.get('result'))[1])()

name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'
      - 'app/docker-compose.yml'
      - 'app/docker-compose.tickets.yml'
      - 'app/.env.example'
      - 'app/n8n/**'
      - 'infra/docs/n8n-webhooks-guide.md'
      - 'infra/scripts/hub-integration-readiness-report.sh'
      - 'infra/scripts/hub-health-history.py'
      - 'infra/scripts/hub-integration-monitor.sh'
      - 'infra/tests/test-hub-integration-readiness-report.sh'
      - 'infra/tests/test-hub-health-history.py'
      - 'infra/tests/run-hub-local-flow.sh'
      - 'infra/scripts/ness-release-manifest.py'
      - 'infra/tests/test-ness-release-manifest.py'
      - 'infra/scripts/aiops-runtime-readiness.sh'
      - 'infra/tests/test-aiops-runtime-readiness.sh'
      - 'infra/scripts/aiops-runtime-preflight.sh'
      - 'infra/tests/test-aiops-runtime-preflight.sh'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./app/backend

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    
    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
        cache: 'pip'
        cache-dependency-path: app/backend/requirements.txt
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8==7.3.0 black==26.5.1
        
    - name: Check code formatting (Black)
      run: |
        black --check .
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        
    - name: Test with pytest
      run: |
        pytest

    - name: Verify local Hub flow with PostgreSQL and Redis
      working-directory: .
      run: bash infra/tests/run-hub-local-flow.sh

    - name: Verify release manifest and runtime readiness guards
      working-directory: .
      run: |
        python -m pytest -q infra/tests/test-ness-release-manifest.py
        python -m pytest -q infra/tests/test-psono-custodian-readiness.py
        python -m pytest -q infra/tests/test-zabbix-quality-wave.py
        python -m pytest -q infra/tests/test_glpi_network_boundary_probe.py
        python -m pytest -q infra/tests/test_glpi_ticket_replay.py
        bash infra/tests/test-aiops-runtime-readiness.sh

    - name: Validate merged AIOps Compose without starting services
      working-directory: .
      run: |
        env_file="$(mktemp)"
        printf '%s\n' \
          'NINF_AUTHENTIK_SECRET_KEY=ci-placeholder' \
          'NINF_DB_PASSWORD=ci-placeholder' \
          'NINF_EVOLUTION_API_KEY=ci-placeholder' \
          'NINF_GLPI_DB_PASSWORD=ci-placeholder' \
          'NINF_GLPI_DB_ROOT_PASSWORD=ci-placeholder' \
          'NINF_JWT_SECRET=ci-placeholder' \
          'NINF_API_IMAGE=registry.example/ness/api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
          'NINF_FRONTEND_IMAGE=registry.example/ness/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' \
          'NINF_RESEND_API_KEY=ci-placeholder' > "$env_file"
        test ! -e app/.env
        test ! -e /etc/ness-os/glpi-integration.env
        test ! -e /etc/ness-os/zabbix-integration.env
        trap 'rm -f -- "$env_file" app/.env; sudo rm -f /etc/ness-os/glpi-integration.env /etc/ness-os/zabbix-integration.env' EXIT
        cp "$env_file" app/.env
        sudo install -d -m 755 /etc/ness-os
        sudo install -m 644 /dev/null /etc/ness-os/glpi-integration.env
        sudo install -m 644 /dev/null /etc/ness-os/zabbix-integration.env
        bash infra/tests/test-release-compose-contract.sh
        docker compose version
        docker compose --env-file "$env_file" \
          -f app/docker-compose.yml -f app/docker-compose.tickets.yml \
          config --quiet --no-env-resolution
        docker compose --env-file "$env_file" \
          -f app/docker-compose.yml -f app/docker-compose.dev.yml -f app/docker-compose.tickets.yml \
          config --quiet --no-env-resolution
        bash infra/scripts/aiops-runtime-preflight.sh --env-file "$env_file"
        bash infra/tests/test-aiops-runtime-preflight.sh

    - name: Verify health history and monitor
      working-directory: .
      run: |
        python3 infra/tests/test-hub-health-history.py
        bash -n infra/scripts/hub-integration-monitor.sh
        bash infra/tests/test-hub-integration-readiness-report.sh

    - name: Set up Node.js 20 for n8n workflow checks
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20.x

    - name: Verify n8n notification workflows
      working-directory: .
      run: node app/n8n/test-workflow-payloads.mjs

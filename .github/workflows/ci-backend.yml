name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/backend/**'
      - 'infra/scripts/hub-health-history.py'
      - 'infra/scripts/hub-integration-monitor.sh'
      - 'infra/tests/test-hub-health-history.py'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./app/backend

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    
    - name: Set up Python 3.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8==7.3.0 black==26.5.1
        
    - name: Check code formatting (Black)
      run: |
        black --check .
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
        
    - name: Test with pytest
      run: |
        pytest

    - name: Verify health history and monitor
      working-directory: .
      run: |
        python3 infra/tests/test-hub-health-history.py
        bash -n infra/scripts/hub-integration-monitor.sh

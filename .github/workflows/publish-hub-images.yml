name: Publish Hub images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ninf-api:${{ github.sha }}

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ninf-frontend:${{ github.sha }}

  release-reference:
    needs: [api, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record immutable image references
        env:
          API_DIGEST: ${{ needs.api.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.frontend.outputs.digest }}
        run: |
          set -eu
          test -n "$API_DIGEST"
          test -n "$FRONTEND_DIGEST"
          {
            echo '## Hub image references'
            echo
            echo "- API: \`ghcr.io/${{ github.repository_owner }}/ninf-api@$API_DIGEST\`"
            echo "- Frontend: \`ghcr.io/${{ github.repository_owner }}/ninf-frontend@$FRONTEND_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Publish Hub images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ninf-api:${{ github.sha }}

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ninf-frontend:${{ github.sha }}

  release-reference:
    needs: [api, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record immutable image references
        env:
          API_DIGEST: ${{ needs.api.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.frontend.outputs.digest }}
        run: |
          set -eu
          test -n "$API_DIGEST"
          test -n "$FRONTEND_DIGEST"
          {
            echo '## Hub image references'
            echo
            echo "- API: \`ghcr.io/${{ github.repository_owner }}/ninf-api@$API_DIGEST\`"
            echo "- Frontend: \`ghcr.io/${{ github.repository_owner }}/ninf-frontend@$FRONTEND_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName zabbix-uat.ness.com.br
    Include /etc/zabbix/apache.conf

    SSLEngine on
    SSLCertificateFile /etc/ssl/ness-os/zabbix-uat-origin.pem
    SSLCertificateKeyFile /etc/ssl/ness-os/zabbix-uat-origin.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/ness-zabbix-uat-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/ness-zabbix-uat-ssl-access.log combined
</VirtualHost>
</IfModule>

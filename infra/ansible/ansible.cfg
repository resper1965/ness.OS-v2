# =============================================================================
# Configuração do Ansible - Projeto Zabbix All-in-One
# =============================================================================
# Descrição: Configurações otimizadas para implantação e gerenciamento
#            do servidor Zabbix 7.0 LTS em Debian 12
# =============================================================================

[defaults]
# Caminho do inventário padrão
inventory = inventory/hosts.yml

# Caminho para busca de roles
roles_path = roles

# Desabilita verificação de chave SSH do host (útil para ambientes controlados)
host_key_checking = False

# Desabilita geração de arquivos .retry em caso de falha
retry_files_enabled = False

# Tempo limite de conexão em segundos
timeout = 30

# Número de hosts processados em paralelo
# Valor 5 é conservador para servidor único, mas permite expansão futura
forks = 5

# Formato de saída YAML para melhor legibilidade nos logs
stdout_callback = yaml

# Desabilita avisos de depreciação para saída mais limpa
deprecation_warnings = False

# Coleta de fatos ativada por padrão (necessário para variáveis do sistema)
gathering = smart

# Cache de fatos para evitar coletas repetidas em múltiplas plays
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600

[privilege_escalation]
# Elevação de privilégios padrão via sudo
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
# Habilita pipelining para melhor performance (reduz operações SSH)
# Requer 'requiretty' desabilitado no sudoers do servidor
pipelining = True

# Argumentos SSH otimizados para conexões estáveis
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30

# Tempo limite para transferência de arquivos via SCP/SFTP
transfer_method = smart

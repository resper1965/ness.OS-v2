---
# Hosts reais (Task 1.2). Chave do agente vem do ambiente; nunca versionar o caminho/valor.
all:
  vars:
    ansible_user: ness_admin
    ansible_port: "{{ ssh_port }}"
    ansible_ssh_private_key_file: "{{ lookup('env', 'NESS_AGENT_KEY') }}"
    ansible_become: true
    ansible_become_method: sudo
    ansible_python_interpreter: /usr/bin/python3
  children:
    zabbix_prod:
      hosts:
        zabbix-prod:
          ansible_host: 144.91.72.202
          ssh_port: 2222
    zabbix_uat:
      hosts:
        zabbix-uat:
          ansible_host: 169.58.234.9
    aiops:
      hosts:
        aiops:
          ansible_host: 144.91.115.242

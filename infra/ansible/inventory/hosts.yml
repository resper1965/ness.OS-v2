---
# =============================================================================
# Inventário Ansible - Servidor Zabbix All-in-One
# =============================================================================
# Descrição: Inventário com servidor único para implantação do Zabbix 7.0 LTS
# Infraestrutura: Storage VPS 40 (8 vCPU, 30 GB RAM, 1.2 TB SSD)
# Sistema Operacional: Debian 12 (Bookworm)
# =============================================================================

all:
  children:
    zabbix_servers:
      hosts:
        zabbix-srv01:
          # Endereço IP do servidor - substituir pelo IP real do VPS
          ansible_host: "SUBSTITUIR_PELO_IP_DO_SERVIDOR"

          # Configurações de conexão SSH
          ansible_port: 2222
          ansible_user: ness_admin
          ansible_connection: ssh

          # Elevação de privilégios via sudo
          ansible_become: true
          ansible_become_method: sudo

          # Interpretador Python (Debian 12 usa Python 3 por padrão)
          ansible_python_interpreter: /usr/bin/python3

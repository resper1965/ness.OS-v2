---
# Hosts reais (Task 1.2). Chave do agente vem do ambiente; nunca versionar o caminho/valor.
# system_hostname = hostname real do SO (scripts operacionais recusam outro nome);
# fontes: infra/docs/as-built-vps.md e infra/docs/agent-access-runbook.md.
all:
  vars:
    ansible_user: ness_admin
    ansible_port: "{{ ssh_port }}"
    ansible_ssh_private_key_file: "{{ lookup('env', 'NESS_AGENT_KEY') | mandatory }}"
    ansible_ssh_common_args: -o IdentitiesOnly=yes
    ansible_become: true
    ansible_become_method: sudo
    ansible_python_interpreter: /usr/bin/python3
  children:
    zabbix_prod:
      hosts:
        zabbix-prod:
          ansible_host: 144.91.72.202
          ssh_port: 2222
          system_hostname: zabbix-srv01
          sudoers_file: ness_admin
          ufw_ssh_comment: SSH - porta customizada
          ufw_allow:
            - { port: 80, comment: HTTP }
            - { port: 443, comment: HTTPS }
            - { port: 10051, comment: Zabbix Trapper }
    zabbix_uat:
      hosts:
        zabbix-uat:
          ansible_host: 169.58.234.9
          system_hostname: zbx-prd-01
          ufw_ssh_comment: SSH key-only bootstrap
          # Só o que o common garante; as faixas Cloudflare e o allowlist de proxies 10051 já estão no UFW e não são tocados.
          ufw_allow:
            - { port: 80, comment: Zabbix production ACME and HTTPS redirect }
            - { port: 443, comment: Zabbix production HTTPS }
            - { port: 10051, from_ip: 144.91.72.202, comment: Zabbix cutover bridge temporary }
    aiops:
      hosts:
        aiops-01:
          ansible_host: 144.91.115.242
          system_hostname: vmi3409271
          sudoers_file: 90-ness-admin
          # ponytail: root loga aqui por chave (stack e IPs do Ricardo); remover root depende do OK do Ricardo.
          ssh_allow_users: [ness_admin, root]
          ufw_allow:
            - { port: 80 }
            - { port: 443 }
    # Vazio até D6/Task 9.2 (Wazuh ainda sem VPS).
    wazuh_hubs: {}

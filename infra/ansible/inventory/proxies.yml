        ansible_ssh_private_key_file: /root/.ssh/id_ed25519
        ansible_python_interpreter: /usr/bin/python3
        ansible_port: 22

    # =========================================================================
    # Cliente: Target
    # =========================================================================
    proxies_target:
      hosts:

        # Proxy: Target - São Paulo
        tgtspprx:
          ansible_host: PLACEHOLDER_IP   # <<< Preencher com IP real
          zabbix_proxy_name: "tgt-sp"
          zabbix_proxyid: 0              # <<< Preencher com ProxyID do Zabbix Server
          ansible_port: 22

        # Proxy: Target - Vitória (ES)
        tgtvixprx:
          ansible_host: PLACEHOLDER_IP   # <<< Preencher com IP real
          zabbix_proxy_name: "tgt-vix"
          zabbix_proxyid: 0              # <<< Preencher com ProxyID do Zabbix Server
          ansible_port: 22

      # Variáveis comuns ao cliente Target
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: /root/.ssh/id_ed25519
        ansible_python_interpreter: /usr/bin/python3
        ansible_port: 22

    # =========================================================================
    # Cliente: Bichara
    # Atenção: hostname com maiúsculas/hífens — usar quotes no SSH se necessário
    # =========================================================================
    proxies_bichara:
      hosts:

        # Proxy: Bichara
        BICHARA-ZBX:
          ansible_host: PLACEHOLDER_IP   # <<< Preencher com IP real
          zabbix_proxy_name: "bichara"
          zabbix_proxyid: 0              # <<< Preencher com ProxyID do Zabbix Server
          # Porta alternativa 2222 caso o SSH padrão não esteja disponível na 22
          ansible_port: 22              # Trocar para 2222 se necessário

      # Variáveis comuns ao cliente Bichara
      vars:
        ansible_user: root
        ansible_ssh_private_key_file: /root/.ssh/id_ed25519
        ansible_python_interpreter: /usr/bin/python3

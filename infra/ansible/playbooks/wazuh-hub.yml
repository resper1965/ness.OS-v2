---
# =============================================================================
# Wazuh R3a single-node (manager + indexer + dashboard) — role common + role wazuh
# =============================================================================
# Alvo: grupo wazuh_hubs (vazio até a VPS existir; ver docs/runbooks/wazuh-r3a-provisionamento.md).
# Decisões pendentes entram por -e e não têm default: wazuh_indexer_retention_days, wazuh_agent_sources.
#
# 1ª execução (VPS recém-criada, só existe o usuário admin da Contabo):
#   NESS_AGENT_KEY=... infra/bin/ansible ansible-playbook playbooks/wazuh-hub.yml -e ansible_user=admin \
#     -e wazuh_indexer_retention_days=<dias> -e '{"wazuh_agent_sources":["<cidr>"]}' --skip-tags retention
# Retenção (depois de guardar a senha do admin no Psono): WAZUH_ADMIN_PASSWORD no ambiente, --tags retention.
# =============================================================================

- name: Wazuh R3a single-node
  hosts: wazuh_hubs
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validar sistema operacional suportado pelo instalador oficial
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu" and ansible_distribution_version == "24.04"
        fail_msg: "Wazuh R3a exige Ubuntu 24.04 (suportado pelo assistente oficial)."
      tags: [always]

  roles:
    - role: common
      tags: [common]
    - role: wazuh
      tags: [wazuh]

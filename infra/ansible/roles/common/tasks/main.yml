---
# ============================================================================
# Role: common - Hardening e configuração base do servidor
# Alvo: Debian 12 (Bookworm) e Ubuntu 24.04
# Descrição: Tarefas de provisionamento inicial, segurança e performance
# ============================================================================

# --------------------------------------------------------------------------
# 1. Atualizar cache APT e fazer upgrade do sistema
# --------------------------------------------------------------------------
- name: Atualizar cache do APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags:
    - apt
    - upgrade

# Off by default: on 27/10 --check showed it would upgrade docker-ce on aiops
# (restarting every container) and autoremove MariaDB plugins on zabbix-prod.
- name: Fazer upgrade completo do sistema
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  when: common_full_upgrade | default(false) | bool
  tags:
    - apt
    - upgrade

# --------------------------------------------------------------------------
# 2. Definir timezone do servidor
# --------------------------------------------------------------------------
- name: Definir timezone para {{ system_timezone }}
  community.general.timezone:
    name: "{{ system_timezone }}"
  tags:
    - timezone

# --------------------------------------------------------------------------
# 3. Configurar locales do sistema (pt_BR.UTF-8 e en_US.UTF-8)
# --------------------------------------------------------------------------
- name: Garantir que o pacote locales está instalado
  ansible.builtin.apt:
    name: locales
    state: present
  tags:
    - locales

- name: Gerar locale pt_BR.UTF-8
  community.general.locale_gen:
    name: pt_BR.UTF-8
    state: present
  tags:
    - locales

- name: Gerar locale en_US.UTF-8
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present
  tags:
    - locales

# --------------------------------------------------------------------------
# 4. Definir hostname do servidor
# --------------------------------------------------------------------------
- name: Definir hostname do servidor
  ansible.builtin.hostname:
    name: "{{ system_hostname | default(inventory_hostname) }}"
  tags:
    - hostname

- name: Garantir entrada do hostname em /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ system_hostname | default(inventory_hostname) }}"
    state: present
  tags:
    - hostname

# --------------------------------------------------------------------------
# 5. Criar usuário administrador com sudo
# --------------------------------------------------------------------------
- name: Criar usuário administrador {{ admin_user }}
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    create_home: true
    groups: sudo
    append: true
    state: present
  tags:
    - usuario
    - seguranca

- name: Configurar NOPASSWD no sudoers para {{ admin_user }}
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/{{ sudoers_file }}"
    regexp: '^{{ admin_user }}\s'
    line: "{{ admin_user }} ALL=(ALL:ALL) NOPASSWD: ALL"
    create: true
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  tags:
    - usuario
    - seguranca

# --------------------------------------------------------------------------
# 6. Garantir a chave do agente (VPS nova não fica sem acesso após AllowUsers)
# --------------------------------------------------------------------------
- name: Configurar chave SSH autorizada para {{ admin_user }}
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_ssh_key }}"
    state: present
    exclusive: false
  tags:
    - ssh
    - seguranca

# --------------------------------------------------------------------------
# 7. Instalar pacotes básicos de administração e utilitários
# --------------------------------------------------------------------------
- name: Instalar pacotes básicos do sistema
  ansible.builtin.apt:
    name:
      - htop
      - iotop
      - curl
      - wget
      - pigz
      - rsync
      - unzip
      - vim
      - tmux
      - git
      - net-tools
      - dnsutils
      - software-properties-common
      - apt-transport-https
      - gnupg2
      - lsb-release
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - pacotes

# --------------------------------------------------------------------------
# 8. Baseline SSH em drop-in próprio (nunca toca sshd_config nem outros drop-ins)
# zz- ordena depois de 00-/50-/99-*: no sshd a primeira ocorrência vence,
# então o baseline só preenche o que nenhum drop-in operacional definiu.
# --------------------------------------------------------------------------
- name: Remover drop-in 50-ness-baseline antigo
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-ness-baseline.conf
    state: absent
  notify: Recarregar SSH
  tags:
    - ssh
    - seguranca

- name: Aplicar baseline SSH com validação da configuração efetiva
  tags:
    - ssh
    - seguranca
  block:
    - name: Instalar drop-in SSH do baseline ness
      ansible.builtin.template:
        src: sshd-ness.conf.j2
        dest: /etc/ssh/sshd_config.d/zz-ness-baseline.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: sshd_baseline
      notify: Recarregar SSH

    - name: Validar configuração completa do sshd
      ansible.builtin.command: sshd -t
      changed_when: false
      # read-only; without it --check skips and the assert fails. In --check the
      # template is not written, so this validates the current config, not the baseline.
      check_mode: false

    - name: Obter configuração efetiva do sshd
      ansible.builtin.command: sshd -T
      register: sshd_effective
      changed_when: false
      check_mode: false

    - name: Afirmar valores efetivos mínimos do sshd
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_effective.stdout_lines"
          - "'pubkeyauthentication yes' in sshd_effective.stdout_lines"
          - "sshd_effective.stdout_lines | select('match', '^permitrootlogin (no|prohibit-password|without-password)$') | list | length == 1"
          - "('port ' ~ ssh_port) in sshd_effective.stdout_lines"
        fail_msg: "Outro drop-in torna o baseline SSH ineficaz; drop-in zz-ness-baseline revertido"

    # not in --check: the template is not written, so sshd -T still shows the pre-baseline AllowUsers.
    # AllowUsers accumulates across drop-ins and sshd -T prints one line per user, hence unique.
    - name: Afirmar que allowusers efetivo é exatamente ssh_allow_users
      ansible.builtin.assert:
        that:
          - "(sshd_effective.stdout_lines | select('match', '^allowusers ') | map('regex_replace', '^allowusers ', '') | unique(case_sensitive=true) | sort(case_sensitive=true)) == (ssh_allow_users | unique(case_sensitive=true) | sort(case_sensitive=true))"
        fail_msg: "AllowUsers efetivo difere de ssh_allow_users; drop-in zz-ness-baseline revertido"
      when: not ansible_check_mode

  rescue:
    - name: Restaurar drop-in anterior do baseline
      ansible.builtin.copy:
        src: "{{ sshd_baseline.backup_file }}"
        dest: /etc/ssh/sshd_config.d/zz-ness-baseline.conf
        remote_src: true
        mode: "0644"
      when: sshd_baseline.backup_file | default('') | length > 0

    - name: Remover drop-in do baseline sem versão anterior
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/zz-ness-baseline.conf
        state: absent
      when:
        - sshd_baseline.backup_file | default('') | length == 0
        - sshd_baseline is changed  # unchanged file was already accepted; keep it

    - name: Falhar sem recarregar o sshd
      ansible.builtin.fail:
        msg: "Baseline SSH rejeitado (sshd -t/-T); drop-in revertido e sshd não recarregado"

# --------------------------------------------------------------------------
# 9. Instalar e configurar UFW (Uncomplicated Firewall)
# --------------------------------------------------------------------------
- name: Instalar UFW
  ansible.builtin.apt:
    name: ufw
    state: present
  tags:
    - firewall
    - seguranca

- name: Configurar política padrão - negar tráfego de entrada
  community.general.ufw:
    direction: incoming
    policy: deny
  notify: Recarregar UFW
  tags:
    - firewall
    - seguranca

- name: Configurar política padrão - permitir tráfego de saída
  community.general.ufw:
    direction: outgoing
    policy: allow
  notify: Recarregar UFW
  tags:
    - firewall
    - seguranca

- name: "Permitir porta SSH tcp {{ ssh_port }}"
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
    comment: "{{ ufw_ssh_comment | default(omit) }}"
  notify: Recarregar UFW
  tags:
    - firewall
    - seguranca

- name: Permitir portas extras do host (ufw_allow)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: tcp
    from_ip: "{{ item.from_ip | default('any') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ ufw_allow }}"
  notify: Recarregar UFW
  tags:
    - firewall
    - seguranca

- name: Ativar UFW
  community.general.ufw:
    state: enabled
  tags:
    - firewall
    - seguranca

# --------------------------------------------------------------------------
# 10. Instalar e configurar Fail2ban
# --------------------------------------------------------------------------
- name: Instalar fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  tags:
    - fail2ban
    - seguranca

- name: Copiar configuração do fail2ban via template
  ansible.builtin.template:
    src: fail2ban-jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reiniciar Fail2ban
  tags:
    - fail2ban
    - seguranca

- name: Habilitar e iniciar serviço fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  tags:
    - fail2ban
    - seguranca

# --------------------------------------------------------------------------
# 11. Configurar NTP via systemd-timesyncd
# --------------------------------------------------------------------------
- name: Instalar systemd-timesyncd
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present
  tags:
    - ntp

- name: Habilitar e iniciar serviço de sincronização de tempo
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  tags:
    - ntp

# --------------------------------------------------------------------------
# 12. Configurar parâmetros sysctl para performance
# --------------------------------------------------------------------------
- name: "Ajustar sysctl - net.core.somaxconn (fila máxima de conexões)"
  ansible.posix.sysctl:
    name: net.core.somaxconn
    value: "65535"
    sysctl_set: true
    state: present
    reload: true
  tags:
    - sysctl
    - performance

- name: "Ajustar sysctl - vm.swappiness (reduzir uso de swap)"
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_set: true
    state: present
    reload: true
  tags:
    - sysctl
    - performance

- name: "Ajustar sysctl - net.ipv4.tcp_max_syn_backlog (fila SYN do TCP)"
  ansible.posix.sysctl:
    name: net.ipv4.tcp_max_syn_backlog
    value: "65535"
    sysctl_set: true
    state: present
    reload: true
  tags:
    - sysctl
    - performance
